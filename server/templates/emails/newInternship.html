<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: Arial, sans-serif; color: #333; line-height: 1.6; }
  .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
  .header { font-size: 24px; font-weight: bold; color: #2563eb; margin-bottom: 20px; text-align: center; }
  .content { font-size: 16px; margin-bottom: 20px; }
  .details { background-color: #f1f5f9; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
  .btn { display: inline-block; padding: 12px 24px; background-color: #2563eb; color: #fff; text-decoration: none; border-radius: 4px; font-weight: bold; text-align: center; }
  .footer { margin-top: 30px; font-size: 14px; color: #777; text-align: center; }
</style>
</head>
<body>
  <div class="container">
    <div class="header">InterFlow</div>
    <div class="content">
      <p>Hello {{studentName}},</p>
      <p>A new internship opportunity has been posted on InterFlow.</p>
      <div class="details">
        <strong>Internship:</strong> {{internshipTitle}}<br/>
        <strong>Company:</strong> {{companyName}}<br/><br/>
        {{description}}
      </div>
      <p>You can log in to InterFlow to view the internship details and apply.</p>
      <div style="text-align: center;">
        <a href="{{clientUrl}}/internships/{{internshipId}}" class="btn">View Internship</a>
      </div>
    </div>
    <div class="footer">
      &copy; {{year}} InterFlow. All rights reserved.
    </div>
  </div>
</body>
</html>
